<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Cloud Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <h1 class="brand-title">Aura ⚡</h1>
            <p class="auth-subtitle">Sign in to sync your cloud profile</p>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div id="error-message" class="error-box hidden"></div>

                <button type="submit" class="auth-btn">Enter Workspace</button>
            </form>

            <p class="auth-footer">
                New to Aura? <a href="signup.html">Create an account</a>
            </p>
        </div>
    </div>

    <script src="static/js/script.js"></script>
</body>
</html>
